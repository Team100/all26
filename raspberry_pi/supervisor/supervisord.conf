[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777 ; so pi user can use it without sudo

[inet_http_server]
port=*:9001

[supervisord]
logfile=/home/pi/supervisord.log
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:app]
directory=/home/pi
command= /home/pi/env/bin/python -u /home/pi/runapp.py
environment = PYTHONFAULTHANDLER = "1"
stdout_logfile=/home/pi/app.stdout
stderr_logfile=/home/pi/app.stderr
autorestart=true

[program:watch-usb]
user=pi
directory=/home/pi
command=/bin/bash -c 'prev=; while true; do now=$(lsusb); if [ "$now" != "$prev" ]; then date; echo "$now"; echo; prev=$now; fi; sleep 5; done'
stdout_logfile=/home/pi/watch-usb.stdout
stderr_logfile=/home/pi/watch-usb.stderr
autorestart=true

[program:shutdown]
command=/sbin/shutdown -P now
autostart=false
autorestart=false
startsecs=0
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface